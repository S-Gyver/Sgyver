<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gyver Code Race - Student Join Lobby</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@600;700&family=Kanit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../../../assets/js/supabaseClient.js"></script>

    <!-- 🟢 สลับมาใช้ CSS สำหรับฝั่ง Student โดยเฉพาะ -->
    <link rel="stylesheet" href="student_lobby.css">
</head>
<body class="cyber-body py-4 position-relative">

    <!-- Background Elements Theme เดียวกับ Race Home -->
    <div class="bg-glow-blur glow-top"></div>
    <div class="bg-glow-blur glow-bottom"></div>
    <div class="bg-cyber-grid"></div>

    <div class="container-fluid px-3 px-md-5 position-relative z-2" style="max-width: 1150px;">
        
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="fw-bold text-cyan font-mono m-0">
                <i class="bi bi-person-bounding-box me-2"></i>ตั้งค่าโปรไฟล์ผู้เข้าแข่งขัน
            </h4>
            <span class="badge bg-info text-dark font-mono px-3 py-2 fs-6">
                ROOM CODE: <span id="lobby-room-code" class="text-dark fw-bold">----</span>
            </span>
        </div>

        <form id="student-join-form" onsubmit="handleStudentJoin(event)">
            <div class="cyber-card p-4">
                <div class="row g-4 align-items-center">
                    
                    <!-- 👈 ฝั่งซ้าย: โซนรูปภาพโปรไฟล์ -->
                    <div class="col-lg-4 d-flex flex-column align-items-center justify-content-center border-end border-secondary pe-lg-4">
                        <div class="position-relative mb-3 text-center w-100">
                            <img id="student-avatar-preview" src="https://api.dicebear.com/7.x/bottts/svg?seed=Racer1" class="avatar-picker-box">
                        </div>
                        
                        <input type="file" id="custom-avatar-input" accept="image/png, image/jpeg, image/jpg, image/webp" class="d-none">

                        <div id="avatar-btn-group" class="d-flex justify-content-center gap-2 w-100 mb-2">
                            <button type="button" class="btn btn-outline-warning btn-sm font-mono flex-fill" id="btn-random-avatar">
                                <i class="bi bi-shuffle me-1"></i>สุ่มรูปอวตาร
                            </button>
                            <button type="button" class="btn btn-outline-info btn-sm font-mono flex-fill" id="btn-upload-avatar">
                                <i class="bi bi-image me-1"></i>เลือกรูปตัวเอง
                            </button>
                        </div>
                        <small class="text-subtle font-mono text-center d-block" id="avatar-status-text" style="font-size: 0.75rem;">* รองรับไฟล์ .jpg, .png, .webp (ไม่เกิน 5MB)</small>
                    </div>

                    <!-- 👉 ฝั่งขวา: สลับแสดงผลระหว่าง (มีข้อมูลเดิม / ฟอร์มเต็ม) -->
                    <div class="col-lg-8">

                        <!-- 🟢 Case A: แสดงเมื่อเคยบันทึกโปรไฟล์ไว้แล้ว (ไม่ต้องกรอกใหม่) -->
                        <div id="saved-profile-card" class="d-none">
                            <div class="p-3 bg-dark rounded-3 border border-info mb-3">
                                <div class="d-flex justify-content-between align-items-center mb-2 border-bottom border-secondary pb-2">
                                    <span class="text-info font-mono fw-bold fs-5">
                                        <i class="bi bi-person-check-fill me-2"></i>ยินดีต้อนรับกลับมา!
                                    </span>
                                    <button type="button" class="btn btn-outline-warning btn-sm font-mono" onclick="enableEditProfileMode()">
                                        <i class="bi bi-pencil-square me-1"></i>แก้ไขข้อมูล
                                    </button>
                                </div>
                                <div class="row g-2 font-mono">
                                    <div class="col-md-6">
                                        <span class="text-subtle small d-block">ชื่อผู้เข้าแข่งขัน (TH):</span>
                                        <span class="text-white fw-bold fs-6" id="saved-display-name-th">-</span>
                                    </div>
                                    <div class="col-md-6">
                                        <span class="text-subtle small d-block">Name (EN):</span>
                                        <span class="text-warning fw-bold fs-6" id="saved-display-name-en">-</span>
                                    </div>
                                    <div class="col-md-6">
                                        <span class="text-subtle small d-block">ชั้นเรียน / ห้อง:</span>
                                        <span class="badge bg-success fs-6" id="saved-display-class">ม.-/-</span>
                                    </div>
                                    <div class="col-md-6">
                                        <span class="text-subtle small d-block">เลขที่:</span>
                                        <span class="text-cyan fw-bold fs-6" id="saved-display-no">-</span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- 🟡 Case B: ฟอร์มกรอกข้อมูลเต็ม (แสดงเฉพาะคนเข้าครั้งแรก หรือกดปุ่มแก้ไข) -->
                        <div id="full-profile-form-zone">
                            <!-- 🇹🇭 1. ข้อมูลภาษาไทย -->
                            <div class="p-3 bg-dark rounded-3 border border-secondary mb-3">
                                <small class="text-cyan font-mono d-block mb-2 fw-bold"><i class="bi bi-flag-fill me-1"></i>ข้อมูลภาษาไทย (THAI INFO)</small>
                                <div class="row g-2">
                                    <div class="col-md-4">
                                        <label class="form-label text-white font-mono small">1. ชื่อเล่น (ไทย) <span class="text-danger">*</span></label>
                                        <input type="text" id="student-nickname-th" class="form-control font-mono" placeholder="เช่น กายเวอร์">
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label text-white font-mono small">2.1 ชื่อจริง (ไทย) <span class="text-danger">*</span></label>
                                        <input type="text" id="student-firstname-th" class="form-control font-mono" placeholder="เช่น สมชาย">
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label text-white font-mono small">2.2 นามสกุล (ไทย) <span class="text-danger">*</span></label>
                                        <input type="text" id="student-lastname-th" class="form-control font-mono" placeholder="เช่น ใจดี">
                                    </div>
                                </div>
                            </div>

                            <!-- 🇬🇧 2. ข้อมูลภาษาอังกฤษ -->
                            <div class="p-3 bg-dark rounded-3 border border-secondary mb-3">
                                <small class="text-warning font-mono d-block mb-2 fw-bold"><i class="bi bi-translate me-1"></i>ข้อมูลภาษาอังกฤษ (ENGLISH INFO)</small>
                                <div class="row g-2">
                                    <div class="col-md-4">
                                        <label class="form-label text-white font-mono small">3. Nickname (EN) <span class="text-danger">*</span></label>
                                        <input type="text" id="student-nickname-en" class="form-control font-mono" placeholder="e.g. Gyver">
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label text-white font-mono small">4.1 Firstname (EN) <span class="text-danger">*</span></label>
                                        <input type="text" id="student-firstname-en" class="form-control font-mono" placeholder="e.g. Somchai">
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label text-white font-mono small">4.2 Lastname (EN) <span class="text-danger">*</span></label>
                                        <input type="text" id="student-lastname-en" class="form-control font-mono" placeholder="e.g. Jaidee">
                                    </div>
                                </div>
                            </div>

                            <!-- 🏫 3. ชั้นเรียน & เลขที่ -->
                            <div class="p-3 bg-dark rounded-3 border border-secondary mb-3">
                                <div class="row g-2 align-items-end">
                                    <div class="col-md-8">
                                        <label class="form-label text-white font-mono small fw-bold">5. ชั้นเรียน / Classroom <span class="text-danger">*</span></label>
                                        <div class="row g-2 align-items-center">
                                            <div class="col-5">
                                                <select id="student-level" class="form-select font-mono" onchange="updateClassPreview()">
                                                    <option value="">-- ระดับชั้น --</option>
                                                    <option value="ม.1">ม.1</option>
                                                    <option value="ม.2">ม.2</option>
                                                    <option value="ม.3">ม.3</option>
                                                    <option value="ม.4">ม.4</option>
                                                    <option value="ม.5">ม.5</option>
                                                    <option value="ม.6">ม.6</option>
                                                </select>
                                            </div>
                                            <div class="col-4">
                                                <select id="student-room" class="form-select font-mono" onchange="updateClassPreview()">
                                                    <option value="">-- ห้อง --</option>
                                                    <option value="1">ห้อง 1</option>
                                                    <option value="2">ห้อง 2</option>
                                                    <option value="3">ห้อง 3</option>
                                                    <option value="4">ห้อง 4</option>
                                                    <option value="5">ห้อง 5</option>
                                                    <option value="6">ห้อง 6</option>
                                                    <option value="7">ห้อง 7</option>
                                                    <option value="8">ห้อง 8</option>
                                                    <option value="9">ห้อง 9</option>
                                                    <option value="10">ห้อง 10</option>
                                                    <option value="11">ห้อง 11</option>
                                                    <option value="12">ห้อง 12</option>
                                                    <option value="13">ห้อง 13</option>
                                                    <option value="14">ห้อง 14</option>
                                                    <option value="15">ห้อง 15</option>
                                                </select>
                                            </div>
                                            <div class="col-3 text-center">
                                                <span class="badge bg-primary fs-6 font-mono w-100 py-2 border border-info" id="class-preview-text">ม.-/-</span>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label text-white font-mono small fw-bold">6. เลขที่ / Number <span class="text-danger">*</span></label>
                                        <input type="number" id="student-number" class="form-control font-mono" placeholder="เช่น 15" min="1" max="99">
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- 👥 4. โซนใส่เลขกลุ่ม (จะโชว์เสมอถ้าครูตั้งโหมดกลุ่ม) -->
                        <div id="team-input-zone" class="p-3 bg-dark rounded-3 border border-secondary mb-3">
                            <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
                                <label class="form-label text-warning font-mono small fw-bold m-0">
                                    <i class="bi bi-people-fill me-1"></i>ระบุหมายเลขกลุ่ม (Team Number):
                                </label>
                                <div class="d-flex align-items-center gap-3">
                                    <input type="number" id="student-team-num" class="form-control text-warning fw-bold border-secondary font-mono text-center" value="1" min="1" max="20" style="width: 100px;">
                                    <div class="form-check form-switch m-0">
                                        <input class="form-check-input" type="checkbox" id="no-team-check" onchange="toggleNoTeam(this.checked)">
                                        <label class="form-check-label text-subtle small font-mono" for="no-team-check">ให้ครูสุ่มกลุ่มให้</label>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <button type="submit" id="btn-submit-join" class="btn btn-warning btn-lg w-100 py-3 font-mono fw-black shadow fs-5">
                            <i class="bi bi-play-circle-fill me-2"></i>พร้อมแล้ว! เข้าห้องแข่งขัน
                        </button>

                    </div>

                </div>
            </div>
        </form>

    </div>

    <script src="student_lobby.js"></script>
</body>
</html>
