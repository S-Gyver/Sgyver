<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WorkChat - เปิดห้องแชท Messenger</title>
    <link rel="manifest" href="features/communication/workchat/manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="features/communication/workchat/icon-192.png">
    <link rel="apple-touch-icon" sizes="192x192" href="features/communication/workchat/apple-touch-icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="WorkChat">
    <meta name="theme-color" content="#0084ff">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: #ffffff;
            color: #65676b;
            text-align: center;
        }
        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid #e4e6eb;
            border-top-color: #0084ff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div>
        <div class="spinner"></div>
        <div style="font-weight: 600; color: #050505; font-size: 1.1rem; margin-bottom: 4px;">กำลังเปิดห้องแชท WorkChat...</div>
        <div style="font-size: 0.85rem;">ระบบแชทสไตล์ Facebook Messenger</div>
    </div>
    <script>
        // Redirect directly to WorkChat application
        const targetUrl = 'features/communication/workchat/workchat.html' + (window.location.search || '');
        window.location.replace(targetUrl);
    </script>
</body>
</html>
