<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gyver Wheel - Scoreboard Live</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        .score-zone-container { display: table; width: 100%; background: transparent; }
        .score-zone-cell { display: table-cell; vertical-align: top; }
        
        /* โพเดียมหน้าจอแยกขนาดใหญ่คู่ตาราง */
        .podium-live-container { display: flex; align-items: flex-end; justify-content: center; height: 320px; width: 340px; padding: 20px; border-radius: 20px; background: rgba(255, 255, 255, 0.1); margin-right: 25px; border: 1px dashed rgba(255,255,255,0.2); }
        .podium-live-block { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; width: 90px; margin: 0 6px; text-align: center; }
        .podium-live-avatar { width: 75px; height: 75px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 6px 12px rgba(0,0,0,0.3); object-fit: cover; background: #444; display: flex; align-items: center; justify-content: center; font-size: 2rem; color: #ccc; margin-bottom: 6px; }
        .podium-live-name { font-size: 0.95rem; font-weight: bold; margin-bottom: 4px; color: #fff; text-shadow: 1px 1px 4px rgba(0,0,0,0.6); max-width: 90px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .podium-live-step { width: 100%; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; font-weight: bold; color: white; border-radius: 8px 8px 0 0; box-shadow: inset 0 4px 6px rgba(255,255,255,0.2); }
        .l-step-1 { height: 130px; background: linear-gradient(135deg, #ff9f43, #ff6b6b); }
        .l-step-2 { height: 95px; background: linear-gradient(135deg, #54a0ff, #5f27cd); }
        .l-step-3 { height: 65px; background: linear-gradient(135deg, #1dd1a1, #10ac84); }
        
        .live-table-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; margin-right: 15px; border: 2px solid #555; background: #444; display: inline-flex; align-items: center; justify-content: center; }
    </style>
</head>
<body class="bg-dark text-white py-5">
    <div class="container-fluid px-5 text-center">
        <h1 class="mb-2 fw-bold text-warning">LEADERBOARD</h1>
        <p class="text-muted mb-5">ตารางอันดับคะแนนสะสมและสถิติแบบ Real-time</p>
        
        <div class="score-zone-container text-start">
            <!-- โพเดียมฝั่งซ้าย -->
            <div class="score-zone-cell" style="width: 365px;">
                <div class="podium-live-container shadow-lg">
                    <!-- อันดับ 2 -->
                    <div class="podium-live-block">
                        <div id="live-p2-avatar" class="podium-live-avatar"><i class="bi bi-person-fill"></i></div>
                        <div id="live-p2-name" class="podium-live-name">-</div>
                        <div class="podium-live-step l-step-2">2</div>
                    </div>
                    <!-- อันดับ 1 -->
                    <div class="podium-live-block">
                        <div id="live-p1-avatar" class="podium-live-avatar"><i class="bi bi-person-fill"></i></div>
                        <div id="live-p1-name" class="podium-live-name">-</div>
                        <div class="podium-live-step l-step-1">1</div>
                    </div>
                    <!-- อันดับ 3 -->
                    <div class="podium-live-block">
                        <div id="live-p3-avatar" class="podium-live-avatar"><i class="bi bi-person-fill"></i></div>
                        <div id="live-p3-name" class="podium-live-name">-</div>
                        <div class="podium-live-step l-step-3">3</div>
                    </div>
                </div>
            </div>

            <!-- ตารางคะแนนฝั่งขวา -->
            <div class="score-zone-cell">
                <div class="table-responsive bg-secondary rounded shadow-lg p-3">
                    <table class="table table-dark table-striped align-middle fs-4">
                        <thead>
                            <tr>
                                <th style="width: 15%" class="text-center">อันดับ</th>
                                <th class="text-start">รายชื่อ</th>
                                <th style="width: 25%" class="text-center">สุ่มโดนไปแล้ว</th>
                                <th style="width: 25%" class="text-center">คะแนนรวม</th>
                            </tr>
                        </thead>
                        <tbody id="live-board"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        function updateLiveBoard() {
            const players = JSON.parse(localStorage.getItem('gyver_players')) || [];
            const sortedPlayers = [...players].sort((a, b) => b.score - a.score);
            const tbody = document.getElementById('live-board');
            
            for(let i = 1; i <= 3; i++) {
                const player = sortedPlayers[i - 1];
                const avatarDiv = document.getElementById(`live-p${i}-avatar`);
                const nameDiv = document.getElementById(`live-p${i}-name`);
                if(player) {
                    nameDiv.innerText = player.name;
                    avatarDiv.innerHTML = player.image ? `<img src="${player.image}" style="width:100%; height:100%; object-fit:cover; border-radius:50%;">` : `<i class="bi bi-person-fill"></i>`;
                } else {
                    nameDiv.innerText = "-";
                    avatarDiv.innerHTML = `<i class="bi bi-person-fill"></i>`;
                }
            }

            if (sortedPlayers.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="text-center text-muted py-4 fs-5">ไม่มีรายชื่อผู้เล่นในระบบขณะนี้</td></tr>`;
                return;
            }

            tbody.innerHTML = sortedPlayers.map((player, idx) => {
                let badge = idx + 1;
                if(idx === 0) badge = '🥇';
                if(idx === 1) badge = '🥈';
                if(idx === 2) badge = '🥉';
                
                let imgTag = player.image ? `<img src="${player.image}" class="live-table-avatar">` : `<div class="live-table-avatar"><i class="bi bi-person-fill"></i></div>`;
                
                return `
                    <tr>
                        <td class="fw-bold text-center">${badge}</td>
                        <td class="text-start">${imgTag}<strong>${player.name}</strong></td>
                        <td class="text-center text-light fs-5">${player.spunCount || 0} ครั้ง</td>
                        <td class="fw-bold text-warning text-center">${player.score} แต้ม</td>
                    </tr>
                `;
            }).join('');
        }

        window.addEventListener('storage', updateLiveBoard);
        window.onload = updateLiveBoard;
        setInterval(updateLiveBoard, 1000);
    </script>
</body>
</html>
