<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gyver Wheel - เข้าสู่ระบบ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body { background: linear-gradient(135deg, #2c3e50, #3498db); height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { width: 100%; max-width: 400px; border-radius: 15px; border: none; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
    </style>
</head>
<body>
    <div class="card login-card bg-white p-4">
        <div class="card-body text-center">
            <div class="mb-3 text-primary" style="font-size: 3.5rem;">
                <i class="bi bi-shield-lock-fill"></i>
            </div>
            <h3 class="fw-bold mb-1 text-dark">Gyver Wheel Draw</h3>
            <p class="text-muted small mb-4">กรุณากรอกรหัสผ่านควบคุมเพื่อเข้าสู่ระบบ</p>
            
            <form id="login-form">
                <div class="form-floating mb-3">
                    <input type="password" id="password-input" class="form-control" placeholder="Password" required autocomplete="current-password">
                    <label for="password-input"><i class="bi bi-key me-2"></i>รหัสผ่านระบบ</label>
                </div>
                <div id="error-msg" class="alert alert-danger py-2 d-none small">รหัสผ่านไม่ถูกต้อง กรุณาลองใหม่!</div>
                <button type="submit" class="btn btn-primary w-100 btn-lg fw-bold shadow-sm">
                    <i class="bi bi-box-arrow-in-right me-2"></i>เข้าสู่ระบบ
                </button>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const password = document.getElementById('password-input').value;
            const errorMsg = document.getElementById('error-msg');

            if (password === 'gyver1234') {
                sessionStorage.setItem('gyver_authenticated', 'true');
                
                // 🎨 แก้ไขเป้าหมายดีฟอลต์ให้เด้งเข้าสู่หน้า wheel.html
                const redirectUrl = sessionStorage.getItem('gyver_redirect_target') || 'wheel.html';
                sessionStorage.removeItem('gyver_redirect_target'); // ล้างข้อมูล Temp
                window.location.href = redirectUrl;
            } else {
                errorMsg.classList.remove('d-none');
                document.getElementById('password-input').value = '';
                document.getElementById('password-input').focus();
            }
        });
    </script>
</body>
</html>
