<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gyver Studio - Authentication</title>
    <!-- นำเข้า Bootstrap CSS และ Bootstrap Icons ให้เข้าธีมหลัก -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <!-- นำเข้า Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            background-color: #1e1e2f;
            color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .auth-card {
            background-color: #27293d;
            border: 1px solid #344675;
            border-radius: 16px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .nav-pills .nav-link {
            color: #a9afbb;
            font-weight: bold;
            border-radius: 8px;
        }
        .nav-pills .nav-link.active {
            background-color: #e14eca !important;
            color: white !important;
            box-shadow: 0 4px 10px rgba(225, 78, 202, 0.4);
        }
        .form-control {
            background-color: #1d1e2f !important;
            border: 1px solid #344675 !important;
            color: white !important;
        }
        .form-control:focus {
            border-color: #e14eca !important;
            box-shadow: 0 0 8px rgba(225, 78, 202, 0.5) !important;
        }
        .form-floating label {
            color: #a9afbb;
        }
        .form-floating > .form-control:focus ~ label,
        .form-floating > .form-control:not(:placeholder-shown) ~ label {
            color: #e14eca !important;
        }
    </style>
</head>
<body>

    <div class="card auth-card p-4 mx-3">
        <div class="card-body">
            <div class="text-center mb-4">
                <div class="text-info mb-2" style="font-size: 3.5rem;">
                    <i class="bi bi-shield-lock-fill"></i>
                </div>
                <h3 class="fw-bold text-white m-0">Gyver Workspace</h3>
                <p class="text-muted small mt-1">ระบบยืนยันตัวตนสมาชิกผ่าน Supabase Auth</p>
            </div>

            <!-- แท็บสลับหน้าจอ Sign In / Sign Up -->
            <ul class="nav nav-pills nav-justified gap-2 mb-4 p-1 bg-dark rounded-3" id="auth-tab" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="tab-login" data-bs-toggle="pill" data-bs-target="#panel-login" type="button" role="tab"><i class="bi bi-box-arrow-in-right me-2"></i>เข้าสู่ระบบ</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="tab-register" data-bs-toggle="pill" data-bs-target="#panel-register" type="button" role="tab"><i class="bi bi-person-plus me-2"></i>สมัครสมาชิก</button>
                </li>
            </ul>

            <!-- กล่องข้อความแจ้งเตือนแจ้งสถานะ -->
            <div id="auth-alert" class="alert d-none py-2 small text-center" role="alert"></div>

            <div class="tab-content" id="auth-tabContent">
                <!-- 1. ฟอร์มเข้าสู่ระบบ (Login) -->
                <div class="tab-pane fade show active" id="panel-login" role="tabpanel">
                    <form id="form-login">
                        <div class="form-floating mb-3">
                            <input type="email" id="login-email" class="form-control" placeholder="name@example.com" required>
                            <label for="login-email"><i class="bi bi-envelope me-2"></i>อีเมลผู้ใช้งาน (Email)</label>
                        </div>
                        <div class="form-floating mb-4">
                            <input type="password" id="login-pass" class="form-control" placeholder="Password" required autocomplete="current-password">
                            <label for="login-pass"><i class="bi bi-key me-2"></i>รหัสผ่าน</label>
                        </div>
                        <button type="submit" class="btn btn-info text-white w-100 btn-lg fw-bold shadow-sm" id="btn-login-submit">
                            <i class="bi bi-box-arrow-in-right me-2"></i>ลงชื่อเข้าใช้งาน
                        </button>
                    </form>
                </div>

                <!-- 2. ฟอร์มสมัครสมาชิก (Register) -->
                <div class="tab-pane fade" id="panel-register" role="tabpanel">
                    <form id="form-register">
                        <div class="form-floating mb-3">
                            <input type="email" id="reg-email" class="form-control" placeholder="name@example.com" required>
                            <label for="reg-email"><i class="bi bi-envelope me-2"></i>ระบุอีเมลสมัครใช้งาน</label>
                        </div>
                        <div class="form-floating mb-3">
                            <input type="password" id="reg-pass" class="form-control" placeholder="Password" minlength="6" required autocomplete="new-password">
                            <label for="reg-pass"><i class="bi bi-key me-2"></i>ตั้งรหัสผ่าน (ขั้นต่ำ 6 ตัว)</label>
                        </div>
                        <div class="form-floating mb-4">
                            <input type="password" id="reg-confirm-pass" class="form-control" placeholder="Confirm Password" minlength="6" required autocomplete="new-password">
                            <label for="reg-confirm-pass"><i class="bi bi-shield-check me-2"></i>ยืนยันรหัสผ่านอีกครั้ง</label>
                        </div>
                        <button type="submit" class="btn btn-success w-100 btn-lg fw-bold shadow-sm" id="btn-reg-submit">
                            <i class="bi bi-person-plus me-2"></i>ยืนยันการสมัครสมาชิก
                        </button>
                    </form>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="login.js"></script>
</body>
</html>
