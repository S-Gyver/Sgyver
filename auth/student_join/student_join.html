<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ลงชื่อเข้าร่วมห้องเรียน - Gyver Lucky Draw</title>

    <!-- Bootstrap 5, Icons & Kanit Font -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="student_join.css">

    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../assets/js/supabaseClient.js"></script>
</head>
<body>

    <div class="join-card">
        <div class="mb-3 text-primary display-4">
            <i class="bi bi-person-check-fill"></i>
        </div>
        <h4 class="fw-bold text-dark mb-1">ลงชื่อเข้าร่วมกิจกรรม</h4>
        <p class="text-secondary small mb-4">กรอกชื่อ-นามสกุล หรือเลขที่ เพื่อเข้าร่วมวงล้อ</p>

        <div class="alert alert-primary py-2 px-3 rounded-3 small fw-bold mb-3 d-flex justify-content-between align-items-center">
            <span>ห้องเรียน: <span id="room-name-display">กำลังตรวจสอบ...</span></span>
            <span class="badge bg-primary font-monospace fs-6" id="room-code-badge">------</span>
        </div>

        <form id="join-form" onsubmit="submitStudentName(event)">
            <div class="mb-3 text-start">
                <label class="form-label small fw-bold text-secondary">ชื่อ - นามสกุล หรือ เลขที่</label>
                <input type="text" id="student-name" class="form-control form-control-lg rounded-3 fs-6" placeholder="เช่น เด็กชายแทนคุณ (เลขที่ 3)" required autofocus>
            </div>
            <button type="submit" id="submit-btn" class="btn btn-primary btn-lg w-100 fw-bold rounded-3 shadow">
                <i class="bi bi-send-fill me-1"></i> ยืนยันเข้าร่วมห้อง
            </button>
        </form>

        <div id="result-success" class="mt-4 p-3 bg-success-subtle text-success rounded-4 d-none">
            <i class="bi bi-check-circle-fill fs-2 d-block mb-1"></i>
            <h5 class="fw-bold mb-1">ลงชื่อสำเร็จแล้ว!</h5>
            <small>ชื่อของคุณถูกส่งไปยังห้องเรียนของครูเรียบร้อย</small>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="student_join.js"></script>
</body>
</html>
